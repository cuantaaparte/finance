<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Simulador de fondos indexados</title>
  <!-- Emoji como icono de la pestaña -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css?v=2026-11-09.1">
  <!-- Scripts clásicos (no módulos) para que funcione con doble clic (file://). El orden importa. -->
  <script defer src="js/config.js?v=2026-11-09.1"></script>
  <script defer src="js/storage.js?v=2026-11-09.1"></script>
  <script defer src="data/ters.js?v=2026-11-09.1"></script>
  <script defer src="data/market-data.js"></script>
  <script defer src="js/dataService.js?v=2026-11-09.1"></script>
  <script defer src="js/finance.js?v=2026-11-09.1"></script>
  <script defer src="js/scenarioCode.js?v=2026-11-09.1"></script>
  <script defer src="js/chart.js?v=2026-11-09.1"></script>
  <script defer src="js/ui.js?v=2026-11-09.1"></script>
  <script defer src="js/main.js?v=2026-11-09.1"></script>
</head>
<body>
  <header class="top">
    <h1>📈 Simulador de fondos indexados</h1>
    <div class="top-right">
      <button id="data-status" class="badge" type="button" title="Pulsa para reintentar la conexión">Cargando datos…</button>
      <label class="switch" title="Cambia todos los importes entre mensual y anual">
        <span>Mensual</span><input type="checkbox" data-key="periodYearly"><i></i><span>Anual</span>
      </label>
    </div>
  </header>

  <main class="layout">
    <!-- Zona de gráfica: en móvil se queda fija arriba mientras haces scroll -->
    <section id="zone" class="zone">
      <div id="kpis" class="kpis"></div>
      <div class="card chart-card">
        <div class="legend">
          <label><input type="checkbox" data-key="showInvested"><b style="--c:#94a3b8"></b>Invertido</label>
          <label><input type="checkbox" data-key="showPrice"><b style="--c:#38bdf8"></b>Con rentabilidad</label>
          <label><input type="checkbox" data-key="showTotal"><b style="--c:#a78bfa"></b>+ dividendos</label>
          <label title="Mismo plan en euros nominales, sin descontar la inflación (lo que marcaría tu cuenta cada año)"><input type="checkbox" data-key="showNominal"><b style="--c:linear-gradient(90deg,#a78bfa,#fb923c)"></b>Sin ajustar a inflación</label>
          <div class="hint">
            <div class="hrow"><strong>€ de hoy</strong><span><i class="dot ok"></i>sostenible</span><span><i class="dot bad"></i>consumes capital</span></div>
            <div class="hrow" id="hint-nominal" hidden><strong>Sin ajustar</strong><span><i class="dot nup"></i>sube</span><span><i class="dot ndown"></i>baja</span></div>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="chart"></canvas>
          <div id="tip" class="tip" hidden></div>
        </div>
      </div>
    </section>

    <!-- Estrategias + supuestos: en PC tienen su propio scroll bajo la gráfica -->
    <div id="side-scroll" class="side-scroll">
      <section id="strat-card" class="card">
        <div class="strat-head"><h2>Estrategias sugeridas</h2><div id="strat-base" class="seg" title="Punto de partida de las estrategias"></div></div>
        <p id="strat-note" class="note"></p>
        <div id="strategies" class="strategies"></div>
      </section>
      <section id="scen-card" class="card">
        <div class="strat-head"><h2>Mis supuestos</h2>
          <button type="button" id="sc-import-btn" class="btn ghost" title="Pega un código de supuesto copiado antes (tuyo o de un amigo)">Importar</button></div>
        <div id="sc-io" class="sc-io" hidden>
          <textarea id="sc-code" rows="3" spellcheck="false" autocomplete="off" placeholder="Pega aquí el código del supuesto…"></textarea>
          <div class="sc-io-row">
            <button type="button" id="sc-paste">Pegar del portapapeles</button>
            <button type="button" id="sc-do-import">Importar</button>
            <button type="button" id="sc-close" class="ghost">Cerrar</button>
          </div>
        </div>
        <p id="sc-msg" class="sc-msg" role="status" hidden></p>
        <form id="save-form" class="save-form">
          <input id="scenario-name" type="text" placeholder="Nombre del supuesto" maxlength="40">
          <button type="submit">Guardar</button>
        </form>
        <ul id="scenarios" class="scenarios"></ul>
      </section>
    </div>

    <aside id="col-a" class="col"></aside>
    <aside id="col-b" class="col"></aside>
  </main>
  <footer id="app-version" class="ver"></footer>
</body>
</html>
