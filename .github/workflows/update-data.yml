name: Actualizar datos de mercado
on:
  schedule: [{ cron: '0 6 * * 1-5' }]   # días laborables, 06:00 UTC
  workflow_dispatch:                    # botón "Run workflow" manual
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/update-data.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/market-data.js
          git diff --cached --quiet || (git commit -m "Actualiza datos de mercado" && git push)
